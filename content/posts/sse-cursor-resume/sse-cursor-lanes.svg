<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" style="background: #16161e; border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;">
  <defs>
    <marker id="a-dim" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#565f89" />
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7aa2f7" />
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff9e64" />
    </marker>
  </defs>

  <!-- terminal header -->
  <rect x="20" y="16" width="880" height="34" rx="6" fill="#1f2335" />
  <circle cx="42" cy="33" r="5" fill="#f7768e" />
  <circle cx="58" cy="33" r="5" fill="#e0af68" />
  <circle cx="74" cy="33" r="5" fill="#9ece6a" />
  <text x="96" y="38" fill="#7aa2f7" font-size="13" font-weight="600">Cursor resolution: two routes, three stores</text>

  <!-- ================= LANE 1: NORMAL CONNECT ================= -->
  <text x="40" y="88" fill="#565f89" font-size="11" letter-spacing="0.5">NORMAL CONNECT: pod restart · deploy · TCP reset · ownership handover</text>

  <rect x="40" y="102" width="168" height="60" rx="6" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1.5" />
  <text x="124" y="126" fill="#c0caf5" font-size="13" text-anchor="middle" font-weight="600">L1 Caffeine</text>
  <text x="124" y="146" fill="#565f89" font-size="11" text-anchor="middle">TTL 30s · per-pod</text>

  <rect x="248" y="102" width="168" height="60" rx="6" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1.5" />
  <text x="332" y="126" fill="#c0caf5" font-size="13" text-anchor="middle" font-weight="600">L2 Redis</text>
  <text x="332" y="146" fill="#565f89" font-size="11" text-anchor="middle">TTL 7d · cross-pod</text>

  <rect x="456" y="102" width="188" height="60" rx="6" fill="#1a1b26" stroke="#e0af68" stroke-width="1.5" />
  <text x="550" y="126" fill="#c0caf5" font-size="13" text-anchor="middle" font-weight="600">checkpoint row</text>
  <text x="550" y="146" fill="#e0af68" font-size="11" text-anchor="middle">oldExternalEventId</text>

  <rect x="684" y="102" width="196" height="60" rx="6" fill="#1a1b26" stroke="#565f89" stroke-width="1.5" />
  <text x="782" y="126" fill="#a9b1d6" font-size="13" text-anchor="middle" font-weight="600">event log head</text>
  <text x="782" y="146" fill="#565f89" font-size="11" text-anchor="middle">…OrderByIdDesc</text>

  <line x1="208" y1="132" x2="242" y2="132" stroke="#565f89" stroke-width="1.5" marker-end="url(#a-dim)" />
  <text x="225" y="124" fill="#565f89" font-size="9" text-anchor="middle">miss</text>
  <line x1="416" y1="132" x2="450" y2="132" stroke="#565f89" stroke-width="1.5" marker-end="url(#a-dim)" />
  <text x="433" y="124" fill="#565f89" font-size="9" text-anchor="middle">miss</text>
  <line x1="644" y1="132" x2="678" y2="132" stroke="#565f89" stroke-width="1.5" marker-end="url(#a-dim)" />
  <text x="661" y="124" fill="#565f89" font-size="9" text-anchor="middle">miss</text>

  <rect x="40" y="182" width="840" height="38" rx="6" fill="#1a2b1f" stroke="#9ece6a" stroke-width="1" />
  <text x="58" y="206" fill="#9ece6a" font-size="12">→ newest persisted id: the connection skipped nothing, so there is nothing to replay</text>

  <!-- ================= LANE 2: DROP-NOTICE RECONNECT ================= -->
  <text x="40" y="306" fill="#565f89" font-size="11" letter-spacing="0.5">DROP-NOTICE RECONNECT: the server said it discarded your messages</text>

  <rect x="40" y="320" width="168" height="60" rx="6" fill="#1a1b26" stroke="#ff9e64" stroke-width="1.5" />
  <text x="124" y="344" fill="#c0caf5" font-size="13" text-anchor="middle" font-weight="600">onComment</text>
  <text x="124" y="364" fill="#ff9e64" font-size="11" text-anchor="middle">drop notice</text>

  <rect x="456" y="320" width="188" height="60" rx="6" fill="#2d2418" stroke="#ff9e64" stroke-width="1.5" />
  <text x="550" y="344" fill="#c0caf5" font-size="13" text-anchor="middle" font-weight="600">checkpoint row</text>
  <text x="550" y="364" fill="#ff9e64" font-size="11" text-anchor="middle">oldExternalEventId</text>

  <line x1="208" y1="350" x2="450" y2="350" stroke="#ff9e64" stroke-width="1.5" marker-end="url(#a-orange)" />
  <text x="329" y="342" fill="#ff9e64" font-size="10" text-anchor="middle">skips L1 + L2: they hold the newest id</text>

  <!-- same store, reached two ways -->
  <line x1="550" y1="320" x2="550" y2="166" stroke="#565f89" stroke-width="1.2" stroke-dasharray="4 4" />
  <text x="562" y="248" fill="#565f89" font-size="10">same row</text>

  <rect x="40" y="400" width="840" height="38" rx="6" fill="#2d2418" stroke="#ff9e64" stroke-width="1" />
  <text x="58" y="424" fill="#ff9e64" font-size="12">→ lagged id: deliberately behind the gap · minutes for fast streams, hours for slow ones</text>

  <text x="40" y="472" fill="#565f89" font-size="11">no lagged pointer stored yet → falls back to the normal route, so a fresh environment still connects (without replay)</text>
</svg>
