baseURL = "https://tushar-c23.github.io/"
title = "Tushar Choudhary"
locale = "en-us"
theme = "nuno"

enableRobotsTXT = true
enableEmoji = true
disableSitemap = false
disableRSS = false

# Clean post URLs: content/posts/week-1.md -> /posts/week-1/
# (no [permalinks] override = Hugo defaults, which are already clean)

[services]
  [services.googleAnalytics]
    ID = "G-4X2YPLZQCE"

[taxonomies]
  tag    = "tags"
  series = "series"

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # allow raw HTML (CV page) and inline HTML in posts
  [markup.highlight]
    noClasses = false      # class-based, so nuno's palettes drive colours
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON is nuno's search index

[params]
  brand        = "tushar@syfe:~$"
  description  = "SDE at Syfe building low-latency, robust financial trading and payment systems that move money across continents. Backend engineering, fintech, brokerage, distributed systems — plus occasional blogs, including Google Summer of Code '24."
  tagline      = "SDE @ Syfe — I build low-latency, robust financial trading systems that move money across continents."
  ground       = "brown"
  defaultTheme = "auto"
  homeHeader   = "profile"
  profileBio   = "SDE @ Syfe. I build low-latency, robust financial trading and payment systems that move money across continents, and write about the internals underneath them."
  homeStyle    = "grid"
  postsOnHome  = 6
  mainSections = ["posts"]
  DateFormat   = "Jan 2, 2006"
  readingProgress = true
  ogImage      = "img/og.png"
  portrait     = "images/portrait.png"   # GitHub avatar

  [params.author]
    name = "Tushar Choudhary"

  [[params.socialIcons]]
    name = "github"
    url  = "https://github.com/tushar-c23"
  [[params.socialIcons]]
    name = "linkedin"
    url  = "https://www.linkedin.com/in/tushar-c23/"
  [[params.socialIcons]]
    name = "email"
    url  = "mailto:tusharc.cse@gmail.com"
  [[params.socialIcons]]
    name = "codeforces"
    url  = "https://codeforces.com/profile/tushar-c23"

[menu]
  [[menu.main]]
    identifier = "posts"
    name       = "Posts"
    url        = "/posts/"
    weight     = 10
  [[menu.main]]
    identifier = "archives"
    name       = "Archive"
    url        = "/archives/"
    weight     = 20
  [[menu.main]]
    identifier = "about"
    name       = "About"
    url        = "/about/"
    weight     = 30

[caches]
  [caches.images]
    dir = ':cacheDir/images'
# nuno resolves og:image through assets/; expose static/img there too
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/img"
    target = "assets/img"
  [[module.mounts]]
    source = "static"
    target = "static"
